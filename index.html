<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LifeLine</title>
  <meta name="description" content="LifeLine – Organiza. Registra. Avanza. Un espacio personal para tu calendario, tus tareas, tus proyectos, tus semanas y tu diario.">
  <meta name="theme-color" content="#f4f4fb">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LifeLine">
  <script>
    // Aplica el tema guardado antes de pintar, para que no parpadee al abrir.
    try {
      var t = JSON.parse(localStorage.getItem('lifeline:data') || '{}').settings;
      if (t && (t.theme === 'light' || t.theme === 'dark')) document.documentElement.dataset.theme = t.theme;
    } catch (e) { /* sin datos todavía */ }
  </script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/inicio" aria-label="LifeLine – Inicio">
        <svg class="brand-logo" aria-hidden="true"><use href="#logo"/></svg>
        <span class="brand-name">LifeLine</span>
      </a>
      <nav class="nav" aria-label="Secciones">
        <a href="#/inicio" data-nav="inicio"><svg class="ic"><use href="#i-home"/></svg><span>Inicio</span></a>
        <a href="#/calendario" data-nav="calendario"><svg class="ic"><use href="#i-calendar"/></svg><span>Calendario</span></a>
        <a href="#/tareas" data-nav="tareas"><svg class="ic"><use href="#i-check-square"/></svg><span>Tareas</span><span class="nav-badge" data-inbox-count hidden></span></a>
        <a href="#/proyectos" data-nav="proyectos"><svg class="ic"><use href="#i-folder"/></svg><span>Proyectos</span></a>
        <a href="#/sprints" data-nav="sprints" data-module="sprints"><svg class="ic"><use href="#i-sprint"/></svg><span>Sprints</span></a>
        <a href="#/diario" data-nav="diario"><svg class="ic"><use href="#i-book"/></svg><span>Diario</span></a>
        <a href="#/registros" data-nav="registros"><svg class="ic"><use href="#i-chart"/></svg><span>Registros</span></a>
      </nav>
      <div class="sidebar-foot">
        <button class="btn btn-ghost btn-block" data-install-shell hidden><svg class="ic"><use href="#i-download"/></svg><span>Instalar app</span></button>
        <nav class="nav" aria-label="Preferencias">
          <a href="#/ajustes" data-nav="ajustes"><svg class="ic"><use href="#i-settings"/></svg><span>Ajustes</span></a>
        </nav>
        <p class="tagline">Organiza. Registra. Avanza.</p>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <a class="topbar-brand" href="#/inicio" aria-label="LifeLine – Inicio">
          <svg class="brand-logo" aria-hidden="true"><use href="#logo"/></svg>
        </a>
        <button class="search-trigger" data-act="search" aria-label="Buscar en LifeLine">
          <svg class="ic"><use href="#i-search"/></svg>
          <span>Buscar en LifeLine…</span>
          <kbd class="kbd">Ctrl K</kbd>
        </button>
        <button class="icon-btn" data-act="toggle-theme" aria-label="Cambiar entre tema claro y oscuro">
          <svg class="ic theme-sun"><use href="#i-sun"/></svg>
          <svg class="ic theme-moon"><use href="#i-moon"/></svg>
        </button>
        <button class="btn btn-primary" data-act="quick-add" aria-haspopup="menu">
          <svg class="ic"><use href="#i-plus"/></svg><span>Añadir</span>
        </button>
      </header>
      <main id="view" class="view"></main>
    </div>

    <nav class="tabbar" aria-label="Secciones">
      <a href="#/inicio" data-nav="inicio"><svg class="ic"><use href="#i-home"/></svg><span>Inicio</span></a>

    </nav>
  </div>

  <div id="modal"></div>
  <div id="menu"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
